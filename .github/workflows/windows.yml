name: Windows build

on:
  push:
    branches: [main, fix/installer-no-global-taskkill-20261014]
    tags: ["v*"]
  pull_request:
    branches: [main, security/s2-auth-core, security/native-messaging-prototype, security/s2-auth-enforcement-tests]
  workflow_dispatch:

# Droits minimum par defaut ; seul le job de compilation peut publier une release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      # Actions epinglees sur un commit precis (une etiquette comme "v4" peut etre deplacee)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pytest

      - name: Regression tests (security + engine)
        env:
          RAPIDO_DATA: ${{ runner.temp }}\rapido-tests
        run: python -m pytest -q tests

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(python -c "import engine; print(engine.VERSION)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$V" ]]; then
            echo "::error::Le tag ($GITHUB_REF) ne correspond pas a engine.VERSION ($V)"; exit 1
          fi
          python packaging/make_version_file.py "$V" > packaging/version_info.txt
          # nouvelle version sur main (tag absent) => on publie une release automatiquement
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && -z "$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$V")" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rapido.exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Rapido
          --icon packaging/rapido.ico
          --version-file packaging/version_info.txt
          --add-data "index.html;."
          --add-data "window.html;."
          --add-data "extension;extension"
          --collect-submodules uvicorn
          --hidden-import pystray._win32
          --hidden-import ytworker
          desktop.py

      - name: Build native messaging host (console)
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name RapidoNativeHost native_host.py

      - name: Build Edge and Firefox development extension folders
        run: |
          python scripts/build_browser_extension.py edge dist/Rapido/extension-edge
          python scripts/build_browser_extension.py firefox dist/Rapido/extension-firefox

      - name: Bundle native host with the desktop executable
        shell: pwsh
        run: Copy-Item -LiteralPath dist/RapidoNativeHost.exe -Destination dist/Rapido/RapidoNativeHost.exe

      - name: Self-test (real window, engine, yt-dlp)
        timeout-minutes: 4
        shell: pwsh
        env:
          RAPIDO_DATA: ${{ runner.temp }}\rapido-data
        run: |
          $out = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process -FilePath "dist\Rapido\Rapido.exe" -ArgumentList "--selftest","--selftest-out",$out -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          if (Test-Path $out) {
            Get-Content $out
            $one = (Get-Content $out -Raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 4) -replace "`r|`n", " "
            Write-Host "::notice title=Selftest::$one"
          } else { Write-Host "Pas de resultat" }
          if (Test-Path "$env:RAPIDO_DATA\rapido.log") { Write-Host "--- rapido.log ---"; Get-Content "$env:RAPIDO_DATA\rapido.log" -Tail 80 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Native Messaging protocol smoke test
        shell: pwsh
        run: |
          $bytes = [System.Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
          $req = [BitConverter]::GetBytes([uint32]$bytes.Length) + $bytes
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo.FileName = (Resolve-Path "dist/RapidoNativeHost.exe").Path
          $proc.StartInfo.UseShellExecute = $false
          $proc.StartInfo.RedirectStandardInput = $true
          $proc.StartInfo.RedirectStandardOutput = $true
          $proc.StartInfo.CreateNoWindow = $true
          if (-not $proc.Start()) { throw "Native host failed to start" }
          $proc.StandardInput.BaseStream.Write($req, 0, $req.Length)
          $proc.StandardInput.BaseStream.Flush()
          $proc.StandardInput.Close()
          $header = New-Object byte[] 4
          $read = $proc.StandardOutput.BaseStream.Read($header, 0, 4)
          if ($read -ne 4) { throw "Invalid native host response header" }
          $length = [BitConverter]::ToUInt32($header, 0)
          if ($length -gt 1024) { throw "Unexpected response size" }
          $body = New-Object byte[] $length
          $read = $proc.StandardOutput.BaseStream.Read($body, 0, $length)
          if ($read -ne $length) { throw "Truncated response" }
          $reply = [System.Text.Encoding]::UTF8.GetString($body) | ConvertFrom-Json
          if ($reply.type -ne "pong" -or $reply.protocol -ne 1) { throw "Native host ping/pong failed" }
          if (-not $proc.WaitForExit(10000) -or $proc.ExitCode -ne 0) { throw "Native host exited abnormally" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\rapido.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and uninstall browser native-host registrations
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'rapido-install-check'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $target = (Get-Item -LiteralPath $target).FullName
          $setup = (Get-ChildItem -LiteralPath dist -Filter 'Rapido-Setup-*.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=" + $target) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $keys = @(
            'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.rapido.bridge',
            'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.rapido.bridge',
            'HKCU:\Software\Mozilla\NativeMessagingHosts\com.rapido.bridge'
          )
          foreach ($key in $keys) {
            $manifest = (Get-Item -LiteralPath $key).GetValue('')
            if (-not (Test-Path -LiteralPath $manifest)) { throw "Missing native manifest: $key" }
            $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            if ($data.name -ne 'com.rapido.bridge' -or $data.path -ne (Join-Path $target 'RapidoNativeHost.exe')) { throw "Invalid manifest: $key" }
          }
          foreach ($folder in @('extension','extension-edge','extension-firefox')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target ($folder + '\manifest.json')))) { throw "Missing browser folder: $folder" }
          }
          # Regression: another, unrelated process named Rapido.exe must survive
          # uninstall. Use a harmless copied Windows ping binary in an isolated directory.
          $otherDir = Join-Path $env:RUNNER_TEMP 'rapido-other-instance'
          New-Item -ItemType Directory -Path $otherDir -Force | Out-Null
          $otherImage = Join-Path $otherDir 'Rapido.exe'
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\ping.exe') -Destination $otherImage
          $other = Start-Process -FilePath $otherImage -ArgumentList '127.0.0.1','-n','60' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($other.HasExited) { throw "Unrelated test process failed to stay running" }
            # Simulate a newer/other installation owning the Run value.
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $foreignRun = '"C:\ForeignRapido\Rapido.exe" --tray'
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -LiteralPath $runKey -Name Rapido -Value $foreignRun
          $process = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ((Get-ItemPropertyValue -LiteralPath $runKey -Name Rapido) -ne $foreignRun) { throw "Uninstaller deleted another installation's autostart value" }
          Remove-ItemProperty -LiteralPath $runKey -Name Rapido
            if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
            $other.Refresh()
            if ($other.HasExited) { throw "Uninstaller terminated an unrelated Rapido.exe process" }
          } finally {
            if (-not $other.HasExited) { Stop-Process -Id $other.Id -Force }
          }
          foreach ($key in $keys) {
            if ((Test-Path -LiteralPath $key) -and $null -ne (Get-Item -LiteralPath $key).GetValue('')) { throw "Native registration survived uninstall: $key" }
          }

      - name: Installed and portable copies coexist across uninstall
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Get-ChildItem -LiteralPath dist -Filter 'Rapido-Setup-*.exe' | Select-Object -First 1).FullName
          $first = Join-Path $env:RUNNER_TEMP 'rapido-ci-owner'
          $second = Join-Path $env:RUNNER_TEMP 'rapido-ci-other'
          $args1 = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=" + $first))
          $p1 = Start-Process -FilePath $setup -ArgumentList $args1 -PassThru -Wait
          if ($p1.ExitCode -ne 0) { throw "First installer failed: $($p1.ExitCode)" }
          $host1 = Join-Path $first 'RapidoNativeHost.exe'
          $key = 'HKCU:\Software\Mozilla\NativeMessagingHosts\com.rapido.bridge'
          $manifest1 = Join-Path $first 'rapido-native-firefox.json'
          try {
            if (-not (Test-Path -LiteralPath $host1) -or -not (Test-Path -LiteralPath $manifest1)) { throw "First installation missing files" }
            $registered1 = (Get-Item -LiteralPath $key).GetValue('')
            if ($registered1 -ne $manifest1) { throw "First installation does not own registration" }
            # Same Inno AppId deliberately identifies one installed product.
            # Do not run a second installer with identical AppId: it would
            # upgrade/move the first install, not create an independent product.
            # Exercise coexistence using a full second *portable* application.
            Copy-Item -LiteralPath 'dist/Rapido' -Destination $second -Recurse
            if (-not (Test-Path -LiteralPath (Join-Path $second 'Rapido.exe')) -or
                -not (Test-Path -LiteralPath (Join-Path $second 'RapidoNativeHost.exe'))) { throw "Second portable app is incomplete" }
            $registered2 = (Get-Item -LiteralPath $key).GetValue('')
            if ($registered2 -ne $registered1) { throw "Portable copy changed registry owner" }
            $p = Start-Process -FilePath (Join-Path $first 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "First uninstall failed: $($p.ExitCode)" }
            if (-not (Test-Path -LiteralPath (Join-Path $second 'Rapido.exe')) -or
                -not (Test-Path -LiteralPath (Join-Path $second 'RapidoNativeHost.exe'))) { throw "Uninstall harmed portable copy" }
            if ((Test-Path -LiteralPath $key) -and $null -ne (Get-Item -LiteralPath $key).GetValue('')) { throw "Uninstall left registry registration" }
            # Exercise the actual preserved portable executable, not just its file existence.
            $portableResult = Join-Path $env:RUNNER_TEMP 'rapido-portable-post-uninstall.json'
            $env:RAPIDO_DATA = Join-Path $env:RUNNER_TEMP 'rapido-portable-post-uninstall-data'
            $portable = Start-Process -FilePath (Join-Path $second 'Rapido.exe') -ArgumentList '--selftest','--selftest-out',$portableResult -PassThru -Wait
            if ($portable.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $portableResult)) {
              throw "Portable Rapido self-test failed after installed copy uninstall: $($portable.ExitCode)"
            }
            $selftest = Get-Content -LiteralPath $portableResult -Raw | ConvertFrom-Json
            Write-Host "Portable Rapido post-uninstall self-test completed: $($portable.ExitCode)"
          } finally {
            if (Test-Path -LiteralPath (Join-Path $first 'unins000.exe')) {
              $p = Start-Process -FilePath (Join-Path $first 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
              if ($p.ExitCode -ne 0) { Write-Warning "Cleanup uninstall exited $($p.ExitCode)" }
            }
            if (Test-Path -LiteralPath $second) { Remove-Item -LiteralPath $second -Recurse -Force }
          }

      - name: Real Firefox native bridge and browser handoff
        timeout-minutes: 6
        shell: pwsh
        run: |
          python -m pip install selenium==4.51.0
          python -m scripts.firefox_native_smoke --bundle dist/Rapido --data "$env:RUNNER_TEMP/rapido-firefox-data" --probe "$env:RUNNER_TEMP/rapido-firefox-probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse extension dist\Rapido\extension
          Compress-Archive -Path dist\Rapido -DestinationPath "dist\Rapido-${{ steps.ver.outputs.version }}-portable.zip"
          Get-ChildItem dist -File | ForEach-Object { Write-Host "::notice title=Fichier::$($_.Name) - $([math]::Round($_.Length/1MB,1)) Mo" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Rapido-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/Rapido-Setup-*.exe
            dist/Rapido-*-portable.zip

      - name: GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Rapido ${{ steps.ver.outputs.version }}
          files: |
            dist/Rapido-Setup-*.exe
            dist/Rapido-*-portable.zip
          body: |
            **Installer :** télécharge `Rapido-Setup-${{ steps.ver.outputs.version }}.exe` et lance-le (pas besoin de droits administrateur).

            Windows peut afficher « Windows a protégé votre ordinateur » : le programme n'est pas signé numériquement.
            Clique sur **Informations complémentaires** puis **Exécuter quand même**.

            Version portable : `Rapido-${{ steps.ver.outputs.version }}-portable.zip`, à dézipper puis lancer `Rapido.exe`.

            Extension Chrome : Rapido > Options > Outils > « Installer l'extension Chrome… ».
