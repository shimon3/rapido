name: Rapido guarded Codex autofix

on:
  workflow_run:
    workflows: ["Windows build"]
    types: [completed]
    branches:
      - automation/rapido-beta2-20261027
      - "codex/rapido-beta2-fix-*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rapido-codex-autofix.yml"
      - ".github/codex/**"
      - "docs/AUTOMATION_CODEX.md"
  workflow_dispatch:

# The workflow definition is loaded from the default branch for workflow_run.
# All runs are serialized so two publishers can never update the same fix PR.
concurrency:
  group: rapido-guarded-codex-autofix
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_BRANCH: automation/rapido-beta2-20261027
  BETA_BASE_BRANCH: public/1.3.0-beta.2
  EXPECTED_WINDOWS_WORKFLOW_BLOB: df0693abcc95feefb607483aae368b3a3f51d8c9
  STATE_ISSUE: "37"
  MAX_ATTEMPTS_PER_ROOT: "3"
  MAX_ATTEMPTS_PER_24H: "3"

jobs:
  policy:
    name: policy dry-run
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Exercise the local patch policy
        run: python3 .github/codex/validate_autofix.py --self-test

  gate:
    name: verify source and reserve attempt
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      vars.RAPIDO_CODEX_AUTOFIX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
      attempt: ${{ steps.guard.outputs.attempt }}
      branch: ${{ steps.guard.outputs.branch }}
      root: ${{ steps.guard.outputs.root }}
      run_id: ${{ steps.guard.outputs.run_id }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Validate immutable inputs and reserve the bounded attempt
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          repo="$GITHUB_REPOSITORY"
          run_json=$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          branch=$(jq -r '.head_branch' <<<"$run_json")
          sha=$(jq -r '.head_sha' <<<"$run_json")
          head_repo=$(jq -r '.head_repository.full_name // empty' <<<"$run_json")

          test "$conclusion" = "failure"
          test "$event" = "workflow_dispatch"
          test "$head_repo" = "$repo"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$branch" == "$TARGET_BRANCH" ]]; then
            source_kind=target
          elif [[ "$branch" =~ ^codex/rapido-beta2-fix-([0-9]+)$ ]]; then
            source_kind=fix
            root="${BASH_REMATCH[1]}"
          else
            echo "Refusing unexpected source branch: $branch" >&2
            exit 1
          fi

          current_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')
          test "$current_sha" = "$sha"

          workflow_blob=$(gh api "repos/$repo/contents/.github/workflows/windows.yml?ref=$sha" --jq '.sha')
          test "$workflow_blob" = "$EXPECTED_WINDOWS_WORKFLOW_BLOB"

          base_sha=$(gh api "repos/$repo/git/ref/heads/$BETA_BASE_BRANCH" --jq '.object.sha')
          ancestry=$(gh api "repos/$repo/compare/$base_sha...$sha" --jq '.status')
          [[ "$ancestry" == "ahead" || "$ancestry" == "identical" ]]

          if [[ "$source_kind" == "fix" ]]; then
            pr_json=$(gh api --method GET "repos/$repo/pulls" \
              -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" -f "base=$TARGET_BRANCH")
            jq -e 'length == 1 and .[0].draft == true' <<<"$pr_json" >/dev/null
          fi

          comments=$(gh api --paginate --slurp \
            "repos/$repo/issues/$STATE_ISSUE/comments?per_page=100")
          trusted_comments=$(jq \
            '[.[][] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")]' \
            <<<"$comments")

          if [[ "$source_kind" == "target" ]]; then
            root=$(jq -r --arg sha "$sha" '
              [.[]
                | select((.body // "") | contains("<!-- rapido-codex-autofix root="))
                | select((.body // "") | contains(" source=" + $sha + " "))
                | .body
                | capture("root=(?<root>[0-9]+)").root][0] // empty
            ' <<<"$trusted_comments")
            if [[ -z "$root" ]]; then
              root="$SOURCE_RUN_ID"
            elif gh api "repos/$repo/git/ref/heads/codex/rapido-beta2-fix-$root" >/dev/null 2>&1; then
              echo "A fix branch already exists for root $root; waiting for its own CI" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          [[ "$root" =~ ^[0-9]+$ ]]

          attempts=$(jq --arg root "$root" '
            [.[]
              | select((.body // "")
              | contains("<!-- rapido-codex-autofix root=" + $root + " "))]
            | length
          ' <<<"$trusted_comments")
          if (( attempts >= MAX_ATTEMPTS_PER_ROOT )); then
            echo "Attempt limit already reached for root $root" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cutoff=$(date -u -d '24 hours ago' +%s)
          daily=$(jq --argjson cutoff "$cutoff" '
            [.[]
              | select((.body // "") | contains("<!-- rapido-codex-autofix root="))
              | select((.created_at | fromdateiso8601) >= $cutoff)]
            | length
          ' <<<"$trusted_comments")
          if (( daily >= MAX_ATTEMPTS_PER_24H )); then
            echo "Repository-wide 24-hour attempt limit reached" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          attempt=$((attempts + 1))
          marker="<!-- rapido-codex-autofix root=$root source=$sha attempt=$attempt run=$SOURCE_RUN_ID -->"
          body="$marker

          Reserved guarded Codex attempt **$attempt/$MAX_ATTEMPTS_PER_ROOT** for failed run [$SOURCE_RUN_ID](https://github.com/$repo/actions/runs/$SOURCE_RUN_ID)."
          gh api "repos/$repo/issues/$STATE_ISSUE/comments" -f body="$body" >/dev/null

          {
            echo "eligible=true"
            echo "attempt=$attempt"
            echo "branch=$branch"
            echo "root=$root"
            echo "run_id=$SOURCE_RUN_ID"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  generate:
    name: generate a read-only patch proposal
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: rapido-codex-autofix
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout trusted control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: control

      - name: Checkout the exact failed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}
          path: target

      - name: Collect bounded failed-job evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.run_id }}
        run: |
          set -euo pipefail
          temporary_log=$(mktemp)
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$temporary_log"
          tail -c 120000 "$temporary_log" > "$RUNNER_TEMP/codex-ci-failure.log"
          rm -f "$temporary_log"

      - name: Prepare allowlisted source context without repository instructions
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 control/.github/codex/prepare_context.py \
            --repo target --revision "$SOURCE_SHA" \
            --destination "$GITHUB_WORKSPACE/context" \
            --log "$RUNNER_TEMP/codex-ci-failure.log"

      - name: Require an explicitly provisioned API key
        shell: bash
        env:
          OPENAI_KEY_PRESENT: ${{ secrets.RAPIDO_CODEX_OPENAI_API_KEY }}
        run: test -n "$OPENAI_KEY_PRESENT"

      - name: Require the Git-only fix-branch key before making an API call
        shell: bash
        env:
          PUSH_KEY_PRESENT: ${{ secrets.RAPIDO_AUTOFIX_PUSH_KEY }}
        run: test -n "$PUSH_KEY_PRESENT"

      - name: Ask Codex for a constrained patch
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1 immutable commit
        with:
          openai-api-key: ${{ secrets.RAPIDO_CODEX_OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/control/.github/codex/rapido-autofix-prompt.md
          output-schema-file: ${{ github.workspace }}/control/.github/codex/rapido-autofix-output.schema.json
          working-directory: ${{ github.workspace }}/context
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          effort: medium
          allow-bots: "true"
          allow-bot-users: "github-actions[bot]"

  validate_proposal:
    name: validate the isolated patch proposal
    needs: [gate, generate]
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.validate.outputs.decision }}
      patch_b64: ${{ steps.validate.outputs.patch_b64 }}
      result_b64: ${{ steps.validate.outputs.result_b64 }}
    steps:
      - name: Checkout trusted control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: control

      - name: Checkout the exact failed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}
          path: target

      - name: Validate the returned JSON and patch
        id: validate
        shell: bash
        env:
          FINAL_MESSAGE: ${{ needs.generate.outputs.final_message }}
        run: |
          set -euo pipefail
          printf '%s' "$FINAL_MESSAGE" > codex-result.json
          jq -e . codex-result.json >/dev/null
          decision=$(jq -r '.decision' codex-result.json)
          [[ "$decision" == "propose" || "$decision" == "stop" ]]
          jq -jr '.patch' codex-result.json > codex.patch
          python3 control/.github/codex/validate_autofix.py \
            --result codex-result.json --patch codex.patch
          if [[ "$decision" == "propose" ]]; then
            git -C target apply --check --whitespace=error-all "$GITHUB_WORKSPACE/codex.patch"
          fi

          {
            echo "decision=$decision"
            echo "result_b64=$(base64 -w0 codex-result.json)"
            echo "patch_b64=$(base64 -w0 codex.patch)"
          } >> "$GITHUB_OUTPUT"

  push_fix_branch:
    name: push the validated fix branch with Git-only credentials
    needs: [gate, generate, validate_proposal]
    if: needs.validate_proposal.outputs.decision == 'propose'
    runs-on: ubuntu-latest
    environment: rapido-codex-autofix
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      fix_branch: ${{ steps.push.outputs.fix_branch }}
      fix_sha: ${{ steps.push.outputs.fix_sha }}
    steps:
      - name: Checkout trusted control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: control

      - name: Checkout the exact failed source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          ref: ${{ needs.gate.outputs.sha }}
          path: target
          ssh-key: ${{ secrets.RAPIDO_AUTOFIX_PUSH_KEY }}

      - name: Revalidate, commit, and push the fix branch
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_B64: ${{ needs.validate_proposal.outputs.patch_b64 }}
          RESULT_B64: ${{ needs.validate_proposal.outputs.result_b64 }}
          ROOT_RUN_ID: ${{ needs.gate.outputs.root }}
          SOURCE_BRANCH: ${{ needs.gate.outputs.branch }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.run_id }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$ROOT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          printf '%s' "$PATCH_B64" | base64 -d > generated.patch
          printf '%s' "$RESULT_B64" | base64 -d > codex-result.json
          python3 control/.github/codex/validate_autofix.py \
            --result codex-result.json --patch generated.patch

          current_source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')
          test "$current_source" = "$SOURCE_SHA"

          fix_branch="codex/rapido-beta2-fix-$ROOT_RUN_ID"
          if remote_fix=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$fix_branch" --jq '.object.sha' 2>/dev/null); then
            test "$remote_fix" = "$SOURCE_SHA"
          fi

          git -C target checkout -B "$fix_branch"
          git -C target apply --index --whitespace=error-all "$GITHUB_WORKSPACE/generated.patch"
          git -C target diff --cached --check
          git -C target config user.name "rapido-codex-autofix[bot]"
          git -C target config user.email "rapido-codex-autofix[bot]@users.noreply.github.com"
          git -C target commit -m "fix: guarded Codex attempt $ATTEMPT for run $ROOT_RUN_ID"
          fix_sha=$(git -C target rev-parse HEAD)
          [[ "$fix_sha" =~ ^[0-9a-f]{40}$ ]]

          git -C target push origin "HEAD:refs/heads/$fix_branch"
          {
            echo "fix_branch=$fix_branch"
            echo "fix_sha=$fix_sha"
          } >> "$GITHUB_OUTPUT"

  publish_draft:
    name: create or update a draft PR without merge permission
    needs: [gate, generate, validate_proposal, push_fix_branch]
    if: needs.validate_proposal.outputs.decision == 'propose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      fix_branch: ${{ needs.push_fix_branch.outputs.fix_branch }}
      fix_sha: ${{ needs.push_fix_branch.outputs.fix_sha }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - name: Create or update the draft proposal and verify its state
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_B64: ${{ needs.validate_proposal.outputs.result_b64 }}
          ROOT_RUN_ID: ${{ needs.gate.outputs.root }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.run_id }}
          FIX_BRANCH: ${{ needs.push_fix_branch.outputs.fix_branch }}
          FIX_SHA: ${{ needs.push_fix_branch.outputs.fix_sha }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$ROOT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$FIX_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FIX_BRANCH" = "codex/rapido-beta2-fix-$ROOT_RUN_ID"
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FIX_BRANCH" --jq '.object.sha')
          test "$actual_sha" = "$FIX_SHA"

          printf '%s' "$RESULT_B64" | base64 -d > codex-result.json
          summary=$(jq -r '.summary' codex-result.json)
          root_cause=$(jq -r '.root_cause' codex-result.json)
          {
            echo "Automated guarded proposal for Rapido 1.3.0-beta.2."
            echo
            echo "- Root CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$ROOT_RUN_ID"
            echo "- Source failure: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
            echo "- Attempt: $ATTEMPT/$MAX_ATTEMPTS_PER_ROOT"
            echo "- Summary: $summary"
            echo "- Root cause: $root_cause"
            echo
            echo "This PR is deliberately draft. The workflow never marks it ready or merges it. Its GitHub token has no contents-write permission, so it cannot call the merge API. Human Code Owner review is required."
          } > pr-body.md

          pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$FIX_BRANCH" --base "$TARGET_BRANCH" --json number,isDraft,url)
          pr_count=$(jq 'length' <<<"$pr_json")
          if (( pr_count == 0 )); then
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft \
              --base "$TARGET_BRANCH" --head "$FIX_BRANCH" \
              --title "draft: guarded Codex fix for run $ROOT_RUN_ID" \
              --body-file pr-body.md)
          else
            test "$pr_count" -eq 1
            jq -e '.[0].isDraft == true' <<<"$pr_json" >/dev/null
            pr_url=$(jq -r '.[0].url' <<<"$pr_json")
            pr_number=$(jq -r '.[0].number' <<<"$pr_json")
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --body-file pr-body.md
          fi

          pr_state=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,author,baseRefName,headRefName,autoMergeRequest)
          jq -e \
            --arg base "$TARGET_BRANCH" \
            --arg head "$FIX_BRANCH" \
            '.isDraft == true and .author.login == "github-actions[bot]" and
             .baseRefName == $base and .headRefName == $head and .autoMergeRequest == null' \
            <<<"$pr_state" >/dev/null
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"


  report_published:
    name: record the draft PR in the persistent log
    needs: [gate, publish_draft]
    if: needs.publish_draft.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record the published draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RUN_ID: ${{ needs.gate.outputs.root }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          PR_URL: ${{ needs.publish_draft.outputs.pr_url }}
        run: |
          set -euo pipefail
          [[ "$ROOT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$PR_URL" == https://github.com/${GITHUB_REPOSITORY}/pull/* ]]
          status_body="<!-- rapido-codex-autofix-status root=$ROOT_RUN_ID attempt=$ATTEMPT -->

          Published draft proposal: $PR_URL. The isolated dispatch job will request its read-only Windows validation."
          gh api "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            -f body="$status_body" >/dev/null

  dispatch_validation:
    name: dispatch the approved validation only
    needs: [gate, generate, push_fix_branch, publish_draft]
    if: needs.publish_draft.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Revalidate the draft and dispatch Windows CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_BRANCH: ${{ needs.publish_draft.outputs.fix_branch }}
          EXPECTED_FIX_SHA: ${{ needs.publish_draft.outputs.fix_sha }}
          EXPECTED_ROOT: ${{ needs.gate.outputs.root }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ROOT" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_FIX_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FIX_BRANCH" = "codex/rapido-beta2-fix-$EXPECTED_ROOT"

          fix_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FIX_BRANCH" \
            --jq '.object.sha')
          test "$fix_sha" = "$EXPECTED_FIX_SHA"

          pr_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$FIX_BRANCH" \
            -f "base=$TARGET_BRANCH")
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$FIX_BRANCH" \
            --arg base "$TARGET_BRANCH" \
            --arg sha "$EXPECTED_FIX_SHA" \
            'length == 1 and .[0].draft == true and
             .[0].head.repo.full_name == $repository and
             .[0].head.ref == $head and .[0].head.sha == $sha and
             .[0].base.ref == $base' <<<"$pr_json" >/dev/null

          workflow_blob=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/windows.yml?ref=$EXPECTED_FIX_SHA" \
            --jq '.sha')
          test "$workflow_blob" = "$EXPECTED_WINDOWS_WORKFLOW_BLOB"

          dispatch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FIX_BRANCH" \
            --jq '.object.sha')
          test "$dispatch_sha" = "$EXPECTED_FIX_SHA"

          gh workflow run windows.yml --repo "$GITHUB_REPOSITORY" --ref "$FIX_BRANCH"

  report_stop:
    name: record a no-change diagnosis
    needs: [gate, generate, validate_proposal]
    if: needs.validate_proposal.outputs.decision == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Persist the safe stop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RUN_ID: ${{ needs.gate.outputs.root }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
        run: |
          set -euo pipefail
          body="<!-- rapido-codex-autofix-status root=$ROOT_RUN_ID attempt=$ATTEMPT -->

          Codex found no policy-compliant confirmed correction. No branch or pull request was created."
          gh api "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            -f body="$body" >/dev/null

  report_failure:
    name: record automation failure
    needs: [gate, generate, validate_proposal, push_fix_branch, publish_draft, dispatch_validation]
    if: >-
      always() &&
      needs.gate.outputs.eligible == 'true' &&
      (needs.generate.result == 'failure' || needs.validate_proposal.result == 'failure' ||
      needs.push_fix_branch.result == 'failure' ||
      needs.publish_draft.result == 'failure' ||
      needs.dispatch_validation.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Persist the safe-stop result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RUN_ID: ${{ needs.gate.outputs.root }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          VALIDATE_RESULT: ${{ needs.validate_proposal.result }}
          PUSH_RESULT: ${{ needs.push_fix_branch.result }}
          PUBLISH_RESULT: ${{ needs.publish_draft.result }}
          DISPATCH_RESULT: ${{ needs.dispatch_validation.result }}
        run: |
          set -euo pipefail
          body="<!-- rapido-codex-autofix-status root=$ROOT_RUN_ID attempt=$ATTEMPT -->

          Guarded attempt stopped safely. Generate: **$GENERATE_RESULT**; validate: **$VALIDATE_RESULT**; push: **$PUSH_RESULT**; publish: **$PUBLISH_RESULT**; dispatch: **$DISPATCH_RESULT**. No merge or release was attempted."
          gh api "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            -f body="$body" >/dev/null
