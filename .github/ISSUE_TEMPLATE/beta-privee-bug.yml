name: "Bêta privée — bug"
description: "Signaler un bug de la bêta privée Rapido (issue PUBLIQUE)"
title: "[bêta privée] "
labels: ["beta-privee", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Cette issue est publique.** N'y mettez ni liens de téléchargement privés, ni cookies,
        ni noms de fichiers personnels, ni captures montrant des données personnelles.
        Problème de sécurité : n'utilisez pas ce formulaire, voir SECURITY.md.
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      description: "Résultat de winver, par exemple Windows 10 22H2 build 19045.6466"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et version (si concerné)
      placeholder: "Chrome 155, Edge 155, Firefox 158"
  - type: input
    id: build
    attributes:
      label: Version de Rapido et 8 premiers caractères de l'empreinte SHA-256 de l'installateur testé
      placeholder: "1.3.0-beta.2 — 1A2B3C4D"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - "Bloquant : impossible d'utiliser Rapido"
        - "Gênant : une fonction ne marche pas"
        - "Mineur : affichage, texte, détail"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu et résultat obtenu
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Extrait de rapido.log (relu, sans données personnelles)
      description: "Ne jamais joindre downloads.json."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: "J'ai vérifié que ce signalement ne contient ni lien privé, ni cookie, ni donnée personnelle."
          required: true
